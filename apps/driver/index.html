<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rapidin - Repartidor 🛵</title>

  <meta name="theme-color" content="#FF6600">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="../../assets/icons/icon-192.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../../shared/styles-core.css">
  <style>
    .driver-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .driver-status-btn {
      background: #FF6600;
      color: #fff;
      padding: 0.5rem 1.2rem;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
    }
    .driver-status-btn.offline { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-secondary); }
    .card-job {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .card-job.active-delivery { border-color: #10B981; box-shadow: 0 0 20px rgba(16,185,129,0.3); }
    #driver-map {
      width: 100%;
      height: 220px;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      border: 1px solid var(--border-color);
    }
    .auth-gate-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-main); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO (AUTH GATE) -->
  <div id="auth-gate-screen" class="auth-gate-screen">
    <div style="text-align: center; margin-bottom: 2rem;">
      <i class="fa-solid fa-motorcycle" style="font-size: 3rem; color: #FF6600; margin-bottom: 1rem;"></i>
      <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Rapidín Repartidores</h1>
      <p style="color: var(--text-secondary);">Ingresa a tu consola de entregas y ganancias</p>
    </div>

    <div class="modal-card" style="width: 100%; max-width: 400px; box-shadow: none; border: 1px solid var(--border-color);">
      <form id="gate-driver-form-login">
        <div style="margin-bottom: 1rem;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 0.4rem;">Correo de repartidor</label>
          <input type="email" id="gate-driver-login-email" class="coupon-input" style="width: 100%;" required>
        </div>
        <div style="margin-bottom: 1.25rem;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 0.4rem;">Contraseña</label>
          <input type="password" id="gate-driver-login-password" class="coupon-input" style="width: 100%;" required>
        </div>
        <div id="gate-login-error" style="color: #EF4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
        <button type="submit" class="driver-status-btn" style="margin-bottom: 1rem; width: 100%; justify-content: center;">Ingresar a la consola</button>
      </form>
      <button type="button" class="driver-status-btn offline" style="font-size: 0.85rem; width: 100%; justify-content: center;" onclick="document.getElementById('modal-driver-register').classList.add('active')">
        <i class="fa-solid fa-id-card"></i> Postular como repartidor
      </button>
    </div>
  </div>

  <div id="main-app-content" style="display: none;">
  <header class="driver-header">
    <div class="container" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
      <div style="display: flex; align-items: center; gap: 0.85rem;">
        <i class="fa-solid fa-motorcycle" style="font-size: 1.8rem; color: #FF6600;"></i>
        <div>
          <h2 style="font-size: 1.15rem;" id="driver-name-label">Repartidor</h2>
          <span style="font-size: 0.8rem; color: var(--text-secondary);" id="driver-meta-label"></span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
        <button class="driver-status-btn" id="btn-toggle-driver-status">
          <i class="fa-solid fa-bolt"></i> <span id="driver-status-text">Cargando…</span>
        </button>
        <button class="driver-status-btn offline" id="btn-driver-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Salir
        </button>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 2rem 1.25rem;">
    <!-- Resumen de Billetera -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
      <div style="background: linear-gradient(135deg, rgba(255,102,0,0.15), rgba(255,51,102,0.15)); border: 1px solid var(--brand-secondary); padding: 1.25rem; border-radius: var(--radius-md);">
        <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Ganancia de hoy</div>
        <div style="font-size: 1.8rem; font-weight: 900; color: var(--brand-secondary); font-family: var(--font-heading);" id="driver-earnings-today">—</div>
      </div>
      <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.25rem; border-radius: var(--radius-md);">
        <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Entregas hoy</div>
        <div style="font-size: 1.8rem; font-weight: 900; color: var(--text-primary); font-family: var(--font-heading);" id="driver-trips-today">—</div>
      </div>
      <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.25rem; border-radius: var(--radius-md);">
        <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Ganancia total</div>
        <div style="font-size: 1.8rem; font-weight: 900; color: #10B981; font-family: var(--font-heading);" id="driver-earnings-total">—</div>
      </div>
    </div>

    <!-- Mapa GPS real del repartidor -->
    <div class="card-job">
      <h3 style="font-size: 1.05rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
        <i class="fa-solid fa-location-crosshairs" style="color: var(--brand-secondary);"></i>
        Tu ubicación
      </h3>
      <div id="driver-map"></div>
      <div style="font-size: 0.8rem; color: var(--text-secondary);" id="driver-location-status">Activa la ubicación para compartir tu posición mientras entregas pedidos.</div>
    </div>

    <!-- Entrega activa -->
    <div id="active-delivery-section" style="display: none; margin-bottom: 2rem;">
      <h2 class="section-title" style="margin-bottom: 1rem;">
        <i class="fa-solid fa-route" style="color: #10B981;"></i> Tu entrega en curso
      </h2>
      <div id="active-delivery-card"></div>
    </div>

    <!-- Entregas disponibles -->
    <div class="section-header">
      <h2 class="section-title">
        <i class="fa-solid fa-bag-shopping" style="color: var(--brand-secondary);"></i> Pedidos cerca de ti
      </h2>
    </div>

    <div id="driver-jobs-list"></div>
  </main>
  </div> <!-- Fin de main-app-content -->

  <!-- MODAL POSTULACIÓN REPARTIDOR -->
  <div class="modal-backdrop" id="modal-driver-register" style="z-index: 10000;">
    <div class="modal-card" style="max-width: 480px; padding: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h2 style="font-size: 1.3rem;">Postulación de repartidor 🛵</h2>
        <button class="btn-close-modal" id="btn-close-driver-reg" style="position: static;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="form-driver-register">
        <div style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 0.3rem;">Nombre completo</label>
          <input type="text" id="reg-driver-name" class="coupon-input" style="width: 100%;" placeholder="Ej: Roberto Gómez" required>
        </div>
        <div style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 0.3rem;">Tipo de vehículo</label>
          <select id="reg-driver-vehicle-type" class="coupon-input" style="width: 100%;">
            <option value="Motocicleta">Motocicleta</option>
            <option value="Bicicleta">Bicicleta / E-Bike</option>
            <option value="Automóvil">Automóvil / Furgón</option>
          </select>
        </div>
        <div style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 0.3rem;">Placa / identificación</label>
          <input type="text" id="reg-driver-plate" class="coupon-input" style="width: 100%;" placeholder="Placa: RPD-99" required>
        </div>
        <div style="margin-bottom: 0.85rem;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 0.3rem;">Correo electrónico</label>
          <input type="email" id="reg-driver-email" class="coupon-input" style="width: 100%;" placeholder="roberto@gmail.com" required>
        </div>
        <div style="margin-bottom: 1.25rem;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 0.3rem;">Contraseña</label>
          <input type="password" id="reg-driver-password" class="coupon-input" style="width: 100%;" minlength="6" required>
        </div>
        <div id="register-error" style="color: #EF4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
        <button type="submit" class="driver-status-btn" style="width: 100%; justify-content: center;">Crear cuenta de repartidor</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../../shared/config.js"></script>
  <script src="../../shared/i18n.js"></script>
  <script src="../../shared/db.js"></script>
  <script src="../../shared/sync.js"></script>
  <script src="../../shared/ui-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
